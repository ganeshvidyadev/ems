# Run before every rollout (`kubectl apply -f migration-job.yaml && kubectl
# wait --for=condition=complete job/ems-migrate -n ems --timeout=300s`,
# wired as its own CI/CD step — see `.github/workflows/ci.yml`'s `deploy`
# job) rather than a Deployment `initContainer`: an initContainer re-runs on
# every pod restart (including a crash-loop), and running migrations once
# per rollout, guarded by `migrate-with-lock.js`'s `GET_LOCK`, is what the
# roadmap's "migration initContainer with advisory lock" actually protects
# against — multiple pods racing on the SAME rollout, not every restart ever.
apiVersion: batch/v1
kind: Job
metadata:
  name: ems-migrate
  namespace: ems
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ems-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: ${API_IMAGE}:${API_IMAGE_TAG} # substituted by CI — see .github/workflows/ci.yml
          command: ['node', 'scripts/migrate-with-lock.js']
          envFrom:
            - configMapRef: { name: ems-api-config }
            - secretRef: { name: ems-api-secrets }
          resources:
            requests: { cpu: '250m', memory: '256Mi' }
            limits: { cpu: '500m', memory: '512Mi' }
