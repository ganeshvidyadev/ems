# Runs `dist/worker.js` — the BullMQ processors and the outbox relay
# (`OutboxRelayService`'s own doc comment: it must run in exactly one role,
# never the API, or N API replicas would all poll the outbox and multiply
# database load). Same image as `api-deployment.yaml`, different role.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-worker
  namespace: ems
  labels:
    app.kubernetes.io/name: ems-worker
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ems-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ems-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: worker
          image: ${API_IMAGE}:${API_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          env:
            - name: EMS_ROLE
              value: worker
            - name: OUTBOX_RELAY_ENABLED
              value: 'true' # overrides the ConfigMap's 'false' for this Deployment only
          envFrom:
            - configMapRef: { name: ems-api-config }
            - secretRef: { name: ems-api-secrets }
          resources:
            requests: { cpu: '250m', memory: '384Mi' }
            limits: { cpu: '1', memory: '768Mi' }
          # No HTTP server in this role — liveness is "the process is still
          # alive", checked the same way `dumb-init`'s PID 1 would be: BullMQ
          # workers hold their Redis connection open, so a dead process (vs.
          # a merely-stalled one, which BullMQ's own stalled-job detection
          # handles) is the only failure mode a probe here can usefully catch.
          livenessProbe:
            exec: { command: ['node', '-e', 'process.exit(0)'] }
            periodSeconds: 30
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
