apiVersion: apps/v1
kind: Deployment
metadata:
  name: ems-api
  namespace: ems
  labels:
    app.kubernetes.io/name: ems-api
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0 # never drop below `replicas` capacity mid-rollout — this is checkout traffic
  selector:
    matchLabels:
      app.kubernetes.io/name: ems-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ems-api
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '4000'
        prometheus.io/path: '/metrics'
    spec:
      # Never in the same AZ/node as another api pod where avoidable — see
      # `pdb.yaml` for the complementary "never below N available" guarantee.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels: { app.kubernetes.io/name: ems-api }
                topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: ${API_IMAGE}:${API_IMAGE_TAG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4000
              name: http
          env:
            - name: EMS_ROLE
              value: api
          envFrom:
            - configMapRef: { name: ems-api-config }
            - secretRef: { name: ems-api-secrets }
          resources:
            requests: { cpu: '250m', memory: '384Mi' }
            limits: { cpu: '1', memory: '768Mi' }
          # Kubernetes' three liveness/readiness/startup probes map directly onto
          # `HealthController`'s own three routes (docs/01 §9): `startup` gives a
          # slow-booting pod (waiting on a cold MySQL connection pool) up to 60s
          # before `liveness` starts counting failures against it at all.
          # No `/api/v1` prefix — `main.ts`'s `setGlobalPrefix` explicitly
          # excludes these three routes from it.
          startupProbe:
            httpGet: { path: /health/startup, port: http }
            failureThreshold: 12
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            periodSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ['ALL'] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {} # writable /tmp for the read-only root filesystem above — e.g. sharp's libvips scratch files during media processing
---
apiVersion: v1
kind: Service
metadata:
  name: ems-api
  namespace: ems
spec:
  selector:
    app.kubernetes.io/name: ems-api
  ports:
    - port: 4000
      targetPort: http
      name: http
