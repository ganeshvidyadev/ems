# Shared proxy_set_header block — included by every location that forwards
# to the API, so `RequestContextMiddleware`/`TenantResolverMiddleware` always
# see the real client IP and the original Host header, never nginx's own.
#
# Lives in `snippets/`, not `conf.d/`: nginx.conf globs `conf.d/*.conf` at the
# http level, and this fragment is only valid inside a `location` block.
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
