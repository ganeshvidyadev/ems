# Top-level nginx config — `http`-scoped settings shared by every server
# block in conf.d/. Split this way so a new tenant-facing vhost never has to
# repeat the TLS/security/rate-limit boilerplate; it only adds a
# `server { }` block.

user nginx;
worker_processes auto;
pid /run/nginx.pid;

events {
  worker_connections 4096;
  multi_accept on;
}

http {
  # Brotli needs the `ngx_brotli` dynamic module, which the stock
  # `nginx:1.27-alpine` image does not ship — loading it here would be
  # `load_module modules/ngx_http_brotli_filter_module.so;` plus the matching
  # static module, built via a custom image stage (e.g. `nginx/unit` or
  # `google/ngx_brotli` compiled against this nginx version). Left as a
  # documented follow-up rather than a directive that fails to start against
  # the image this compose file actually pulls; gzip below is the compression
  # that is genuinely active.
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  server_tokens off; # never advertise the nginx version to a scanner

  log_format main '$remote_addr - $host [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" rt=$request_time uct="$upstream_connect_time" urt="$upstream_response_time"';
  access_log /var/log/nginx/access.log main;
  error_log /var/log/nginx/error.log warn;

  # TLS 1.3 only, plus 1.2 for the long tail of clients that can't negotiate
  # 1.3 yet — never 1.0/1.1, both are broken protocols by now.
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off; # let modern clients pick their own (better) cipher under TLS 1.3
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;
  ssl_stapling on;
  ssl_stapling_verify on;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types application/json application/javascript text/css text/plain application/xml image/svg+xml;

  # Every response gets these regardless of vhost — a merchant storefront
  # forgetting a security header is not a per-tenant decision to get right.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;

  # Keyed by IP for the API; a per-tenant key would be nicer but the tenant
  # isn't known until the request reaches the app (subdomain/custom-domain
  # resolution happens in `TenantResolverMiddleware`), so IP is the only
  # thing nginx itself can see. `burst` absorbs a legitimate page's fan-out
  # of requests without rejecting the first one over the limit.
  limit_req_zone $binary_remote_addr zone=api_general:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=api_auth:10m rate=5r/s;
  limit_req_status 429;

  include /etc/nginx/conf.d/*.conf;
}
