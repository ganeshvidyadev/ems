# One upstream for every vhost below — `least_conn` so a slow request on one
# API replica doesn't keep getting more work piled onto it than an idle one.
upstream ems_api {
  least_conn;
  server api:4000 max_fails=3 fail_timeout=10s;
  keepalive 64;
}

# Plain HTTP: redirect everything to HTTPS. No HTTP-01 ACME challenge
# exception needed here — `DomainVerificationService` proves domain
# ownership via DNS-01 (`_acme-challenge` TXT record through
# `CloudflareDnsAdapter`), never HTTP-01, so there is no challenge path this
# server ever needs to answer unencrypted.
server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name _;

  location / {
    return 301 https://$host$request_uri;
  }
}

# One server block handles every hostname this platform answers for:
# `console.ems.example.com`, every tenant's `{slug}.ems.example.com`
# (wildcard), and every verified custom domain (SNI-matched by certificate,
# not by a hostname pattern here) — `TenantResolverMiddleware` inside the API
# is what actually tells these apart; nginx's job is only to terminate TLS
# and forward.
server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name _;

  # The wildcard cert covers `*.ems.example.com`; each verified custom domain
  # gets its own cert issued by `AcmeAccountEntity`'s ACME account and is
  # loaded via SNI here — `ssl_certificate`/`ssl_certificate_key` below are
  # the platform's own wildcard as the default for any SNI nginx doesn't have
  # a specific certificate for yet.
  ssl_certificate     /etc/nginx/certs/wildcard.crt;
  ssl_certificate_key /etc/nginx/certs/wildcard.key;

  client_max_body_size 20m; # product image / bulk CSV import uploads

  # Real route shapes, from `main.ts`'s own `setGlobalPrefix` call: every
  # versioned product route is `/api/v1/...` (API_PREFIX + URI versioning),
  # while health/metrics/JWKS are deliberately excluded from that prefix —
  # `main.ts`'s own comment explains why (Kubernetes/Prometheus/RFC-8414
  # convention, not this app's API surface).
  location /api/v1/auth/login {
    limit_req zone=api_auth burst=10 nodelay;
    proxy_pass http://ems_api;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location /api/ {
    limit_req zone=api_general burst=40 nodelay;
    proxy_pass http://ems_api;
    include /etc/nginx/snippets/proxy-common.conf;
  }

  location = /health/live {
    access_log off;
    proxy_pass http://ems_api;
  }

  location /.well-known/jwks.json {
    proxy_pass http://ems_api;
  }

  location / {
    return 404;
  }
}
